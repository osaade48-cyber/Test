<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kindo — Pre-loved baby &amp; kids gear and clothes</title>
    <meta name="description" content="Buy and sell pre-loved baby and kids gear and clothes across Australia. Prams, cots, car seats, toys and clothing — with secure payments held until you've got the item." />
    <meta property="og:title" content="Kindo — Pre-loved baby & kids gear and clothes" />
    <meta property="og:description" content="Buy and sell pre-loved baby and kids gear and clothes across Australia, with secure payments and QR handover." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#F6F3EF" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("kindo:theme");
        if (t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
