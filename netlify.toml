# Netlify settings for averaearthworx.com.au
[build]
  publish = "."

# Keep old Shopify links working (Google results, bookmarks, business listings)
[[redirects]]
  from = "/pages/services"
  to = "/services"
  status = 301
[[redirects]]
  from = "/pages/about"
  to = "/about"
  status = 301
[[redirects]]
  from = "/pages/contact"
  to = "/contact"
  status = 301
[[redirects]]
  from = "/pages/projects"
  to = "/services"
  status = 301
[[redirects]]
  from = "/collections/*"
  to = "/"
  status = 301
[[redirects]]
  from = "/products/*"
  to = "/"
  status = 301

# Short booking link (used in texts) -> GoHighLevel "Free site visit" calendar
[[redirects]]
  from = "/book"
  to = "https://api.leadconnectorhq.com/widget/booking/ZTe5bE2GV9krDfT3Qnct"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
# CSS/JS: always check for a newer version, so site updates show straight away
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
